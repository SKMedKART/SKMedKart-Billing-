name: Build SKMedKART APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android Project
        run: |
          mkdir -p project
          unzip -o SKMedKART_READY_ANDROID_PROJECT.zip -d project

      - name: Find Android Project
        run: |
          echo "Android project files:"
          find project -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKMedKART-APK
          path: project/**/*.apk
          if-no-files-found: error
