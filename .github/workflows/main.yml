name: Build SKMedKART APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir -p project
          unzip -o SKMedKART_READY_ANDROID_PROJECT.zip -d project

      - name: Find Gradle Project
        run: |
          GRADLEW=$(find project -name gradlew -type f -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "Found: $GRADLEW"

      - name: Make gradlew executable
        run: |
          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKMedKART-APK
          path: project/**/*.apk
          if-no-files-found: error
